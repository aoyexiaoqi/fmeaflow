[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fmeaflow"
version = "0.1.0"
description = "PFMEA and Control Plan consistency checker for manufacturing quality engineering"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "aoyexiaoqi" }]
keywords = ["pfmea", "control-plan", "quality", "manufacturing", "aiag-vda", "consistency-check"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pandas>=1.5",
  "openpyxl>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
fmeaflow = "fmeaflow.cli:main"

[project.urls]
Homepage = "https://github.com/aoyexiaoqi/fmeaflow"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["fmeaflow"]
